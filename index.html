<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random To You</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Random To You (랜덤투유) 🎲</h1>
        <p class="intro">"너에게 랜덤하게"</p>

        <hr>

        <div class="card">
            <h2>1. WWYD (What Will You Do?)</h2>
            <p>오늘 뭐할지 고민될 때 클릭!</p>
            
            <button id="wwyd-button">오늘 뭐하지?</button>
            
            <div id="wwyd-result" class="result-box">
                (결과가 여기에 나옵니다)
            </div>
        </div>

        <div class="card">
            <h2>2. WTW (What's The Weather?)</h2>
            <p>가천대 위치의 현재 날씨 기반 돌림판</p>
            
            <button id="wtw-button">오늘 날씨는? 🌤️</button>
            
            <div id="wtw-result" class="result-box">
                (날씨 결과가 여기에 나옵니다)
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
